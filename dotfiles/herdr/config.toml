onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
# tmux split on `bind - split-window -v` and `bind | split-window -h`. herdr
# names a split after the divider it draws, which is the same way round.
split_horizontal = ["prefix+minus", "alt+enter"]
split_vertical = ["prefix+|", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# select-pane -L/-D/-U/-R
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# resize-pane -L/-D/-U/-R. tmux bound these with `-r` so the prefix stays live
# for repeats; herdr has no such flag, so resize_mode below covers held resizing.
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
# kill-window sat on `bind W`; herdr's default prefix+k is now focus_pane_up.
close_tab = "prefix+shift+w"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
# tmux put kill-session on `bind K`, but that line shadowed its own
# `bind -r K resize-pane -U 5`, so resize-up never fired there. herdr rejects
# the duplicate outright, so kill-session moves aside and the resize row wins.
close_workspace = "prefix+shift+x"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Agents. herdr ships these unset. Agents cut across tabs and workspaces, so
# rather than a third p/n tier they get their own keys.
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+shift+1..9"

# tmux swapped panes with `bind { swap-pane -U` / `bind } swap-pane -D`, which
# walked pane index order and offered no left/right. herdr's swaps are spatial
# and four-way, so they take the third hjkl tier instead: bare prefix focuses,
# prefix+shift resizes, prefix+ctrl swaps. Same layering as SUPER / SUPER+CTRL
# on hjkl in dotfiles/hypr/bindings.lua. resize_mode keeps prefix+ctrl+arrows,
# so the ctrl tier splits cleanly: letters swap, arrows resize.
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

# Worktrees. herdr defaults new_worktree to prefix+shift+g and leaves the
# other two unset; useful for putting an agent on its own branch.
open_worktree = "prefix+shift+f"
remove_worktree = "prefix+shift+d"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "system"
