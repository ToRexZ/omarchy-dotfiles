# Local override — not managed by the plugin, survives `omarchy plugin update`.
#
# bin/logi uses `#!/usr/bin/env python3`, and mise's shims come before /usr/bin
# on the systemd user PATH, so `env python3` resolves to mise's interpreter.
# solaar's logitech_receiver library is installed only in the system Python
# (/usr/lib/python3.14/site-packages), so the daemon must run under
# /usr/bin/python3. That path stays correct across Arch's Python bumps.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 %h/.config/omarchy/plugins/io.github.rvcabc.logitech/bin/logi daemon
